# Publishes the slides on GitHub Pages at every push to main: the presentation as
# index.html and a PDF copy as slides.pdf.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the slides
        run: |
          mkdir -p _site
          npx -y @marp-team/marp-cli@4 --theme-set pybr2026.css --html --allow-local-files -o _site/index.html slides.md
          npx -y @marp-team/marp-cli@4 --theme-set pybr2026.css --html --allow-local-files --pdf -o _site/slides.pdf slides.md
          cp -r img _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
